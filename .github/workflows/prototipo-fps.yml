# Prototipo F0: mide los cuadros por segundo en los 30 pares de prueba (issue #12).
# Solo registra: no tiene umbral y no bloquea el PR (continue-on-error).
# El resultado queda en el resumen del trabajo y como artefacto fps.json.
name: Prototipo · fps

on:
  pull_request:
    paths:
      - "apps/prototipo/**"
      - ".github/workflows/prototipo-fps.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: prototipo-fps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fps:
    name: Medir fps (sin umbral)
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/prototipo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      # Licencias (D12): mathjax Apache-2.0, js-yaml MIT, playwright Apache-2.0.
      # Se instalan sin package.json para no sumar el prototipo al workspace de pnpm.
      - name: Instalar MathJax, js-yaml y Playwright
        run: |
          npm i --no-save --prefix . mathjax@4.1.3 @mathjax/mathjax-newcm-font@4.1.3 js-yaml@4.1.0 playwright@1.63.0
          npx playwright install --with-deps chromium

      - name: Pares al día
        run: node evaluacion/generar-pares.mjs --revisar

      - name: Medir
        run: |
          python3 -m http.server 8765 > /dev/null 2>&1 &
          sleep 1
          node evaluacion/medir-fps.cjs --salida fps.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: prototipo-fps
          path: apps/prototipo/fps.json
          if-no-files-found: ignore
